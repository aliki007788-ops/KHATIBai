services:
  - type: web
    name: khatib-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: CORS_ORIGINS
        value: https://khati-ltuvglv57-aki-c2e06dad.vercel.app
      - key: FRONTEND_URL
        value: https://khati-ltuvglv57-aki-c2e06dad.vercel.app
      - key: ENVIRONMENT
        value: production
